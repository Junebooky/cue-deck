name: Cue Deck checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run check
      - run: node --check electron/main.mjs
      - run: node --check electron/preload.cjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Download Electron for native keyboard smoke test
        run: node node_modules/electron/install.js
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: ""
      - name: Electron native keyboard smoke test
        run: xvfb-run -a node tests/electron-shortcuts.mjs
